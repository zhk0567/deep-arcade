<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf5ef"><meta name="description" content="和小鲸娘一起，合成海湾里的新模样。">
  <title>合成大肥鱼 · 小鲸娘的海湾</title>
  <link rel="stylesheet" href="styles.css?v=0.6.8"><link rel="stylesheet" href="tarot.css?v=0.6.8"><link rel="stylesheet" href="unlock.css?v=0.6.8">
  <script defer src="vendor/matter.min.js?v=0.6.8"></script><script defer src="config.js?v=0.6.8"></script><script defer src="engine.js?v=0.6.8"></script><script defer src="progress.js?v=0.6.8"></script><script defer src="companion.js?v=0.6.8"></script><script defer src="audio.js?v=0.6.8"></script><script defer src="replay.js?v=0.6.8"></script><script defer src="leaderboard.js?v=0.6.8"></script><script defer src="voice.js?v=0.6.8"></script><script defer src="saved-round.js?v=0.6.8"></script><script defer src="tarot-data.js?v=0.6.8"></script><script defer src="unlocks.js?v=0.6.8"></script><script defer src="home-dialogue.js?v=0.6.8"></script><script defer src="game.js?v=0.6.8"></script>
<link rel="icon" type="image/png" href="assets/brand/miniprogram-icon-v066-144.png"><link rel="apple-touch-icon" href="assets/brand/miniprogram-icon-v066-512.png"></head>
<body>
<div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
<div class="app-shell" id="appShell" data-screen="home">
  <header class="site-header">
    <a class="brand" href="#" aria-label="返回合成大肥鱼首页"><span class="brand-mark"><img src="assets/whale.svg" width="37" height="37" alt=""></span><span><strong>合成大肥鱼</strong><small>和小鲸娘一起，慢慢长大</small></span></a>
    <nav class="header-actions" aria-label="游戏设置">
      <button class="icon-button" id="soundButton" aria-label="关闭音效" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button>
    </nav>
  </header>

  <main id="homeScreen" class="home-screen">
    <section class="home-hero" aria-label="欢迎来到小鲸娘的海湾">
      <div class="hero-art">
        <div class="hero-orbit" aria-hidden="true"><span>✧</span><i>✦</i></div>
        <button class="home-mascot" id="homeMascot" aria-label="大肥鱼，来戳戳我吧" data-mood="idle">
          <span class="mascot-sprite" id="homeSprite" data-pose="idle" role="img" aria-label="一级大肥鱼"></span>
          <span class="mascot-hearts" aria-hidden="true">♡　♡</span>
        </button>
        <p class="home-speech" id="homeSpeech" aria-live="polite">今天也想和你一起玩～</p>
        <p class="tap-hint">来戳戳我吧～</p>
      </div>
      <div class="hero-copy">
        <p class="eyebrow">一场小小的海底奇遇</p>
        <h1>今天，也要<br>合成一点<span>快乐。</span></h1>
        <p class="hero-description">让相同的小鲸娘相遇，<br>发现只属于你的新模样。</p>
        <div class="home-play-actions">
          <button class="start-button" id="startButton" aria-label="开始合成" disabled><span class="start-whale" aria-hidden="true"><svg viewBox="0 0 48 32" fill="currentColor"><path d="M12 16 2 6v20Zm4-10c13-6 30-1 30 10S29 32 16 26C7 22 7 10 16 6Z"/><circle cx="35" cy="12" r="2" fill="#477b93"/></svg></span><span class="action-copy"><strong id="startButtonText">正在迎接鲸娘…</strong><small>和蓝鲸团子一起出发</small></span></button>
          <button class="continue-button" id="continueButton" aria-label="继续上一局" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg><strong id="continueButtonText">继续上一局</strong><small id="continueStatus" aria-live="polite">暂无存档</small></button>
        </div>
        <div class="home-meta"><span>最高分 <strong id="homeBestValue">0</strong></span><span>轻轻一投，惊喜就会发生</span></div>
      </div>
    </section>

    <section class="home-collection" id="homeCollection">
      <button class="collection-toggle" id="collectionToggle" aria-haspopup="dialog" aria-controls="galleryDialog"><span class="collection-icon" aria-hidden="true">✧</span><span><strong>人物图鉴</strong><small>看看一路相伴的鲸娘</small></span><span id="discoveryCount" class="discovery-count">1 / 10</span><span class="collection-chevron" aria-hidden="true">→</span></button>
    </section>
    <button class="leaderboard-button" id="leaderboardButton" aria-haspopup="dialog"><span aria-hidden="true">♕</span> 海湾排行榜 <span aria-hidden="true">→</span></button>
    <p class="home-footer">小小的相遇，也会长成一片海。</p>
  </main>

  <main id="playScreen" class="play-screen" hidden>
    <div class="play-hud">
      <div class="score-card" aria-label="对局分数"><div><span>本局得分</span><strong id="scoreValue">0</strong></div><div class="best-score"><span>最高分</span><strong id="bestValue">0</strong></div></div>
      <div class="board-actions"><button class="icon-button" id="pauseButton" aria-label="暂停游戏"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg></button><button class="icon-button" id="restartButton" aria-label="重新开始"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11a8 8 0 1 1 2.3 6.7M4 4v7h7"/></svg></button></div>
    </div>
    <div class="play-column">
      <div class="board-frame" id="boardFrame">
        <canvas id="gameCanvas" width="840" height="1280" tabindex="0" aria-label="鲸娘合成游戏。左右移动选位置，松手或按空格投放。"></canvas>
        <div class="board-toast" id="boardToast" role="status"></div>
        <div class="board-overlay is-hidden" id="boardOverlay"><div class="overlay-content" id="overlayContent"><div class="result-emblem"><canvas id="welcomeCanvas" width="240" height="240" aria-hidden="true"></canvas></div><span class="eyebrow" id="overlayKicker"></span><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="result-stats" id="resultStats" hidden></div><button class="primary-button" id="primaryButton"><span id="primaryButtonText">继续合成</span></button><div class="overlay-links"><button class="text-button" id="secondaryButton" hidden>重新开始</button><button class="text-button" id="homeButton">返回首页</button></div><button class="save-round-button" id="saveRoundButton" hidden>保存对局并返回首页</button><button class="pause-sound" id="pauseSoundButton" aria-pressed="true" hidden>音效：已开启</button><small id="welcomeFootnote"></small></div></div>
<div class="unlock-notice" id="unlockNotice" role="status" aria-live="polite" aria-atomic="true" hidden>


<div class="unlock-stage"><div class="tarot-card unlock-card" aria-hidden="true"><span class="tarot-card-inner" id="unlockInner">
<span class="tarot-face tarot-back"><span class="tarot-back-label">潮 汐 新 遇</span><span class="tarot-back-invitation">她带着新的故事而来</span></span>
<span class="tarot-face tarot-front" id="unlockFront"><span class="tarot-arcana" id="unlockArcana"></span><img id="unlockImage" alt=""><span class="tarot-title-plate"><strong id="unlockName"></strong><small id="unlockSubtitle"></small></span></span>
</span></div></div><div class="unlock-caption"><h2 id="unlockTitle">遇见新的鲸娘</h2></div>
<button type="button" class="unlock-close" id="unlockClose" disabled>新的相遇即将揭晓…</button></div>
        <div class="danger-message" id="dangerMessage" hidden>上下文快满了，试着腾一点空间</div>
      </div>
    </div>
    <aside class="companion" id="companion" data-reaction="idle" aria-label="大肥鱼应援">
      <div class="buddy-stage"><div class="buddy-halo" aria-hidden="true"></div><span class="mascot-sprite" id="buddySprite" data-pose="idle" role="img" aria-label="为你加油的一级大肥鱼"></span><span class="buddy-spark" aria-hidden="true">✧</span></div>
      <div class="buddy-bubble"><span class="buddy-name">小鲸娘应援中</span><p id="buddySpeech" aria-live="polite">放心投吧，我会为你加油～</p></div>

    </aside>
    <div class="board-footer"><span id="roundStatus">海湾合成中</span><span>移动选位置 · 松手投放</span></div>
  </main>
</div>

<dialog class="modal gallery-modal tarot-modal" id="galleryDialog" aria-labelledby="galleryTitle">
<button class="modal-close" data-close="galleryDialog" aria-label="关闭图鉴">×</button>
<div class="gallery-layout"><div class="gallery-art tarot-stage">
<div class="tarot-card gallery-static" id="galleryCard" role="img" aria-label="角色立绘卡">
<span class="tarot-face tarot-front" id="tarotFront"><span class="tarot-arcana" id="tarotArcana"></span><img id="galleryImage" alt=""><span class="tarot-title-plate"><strong id="tarotName"></strong><small id="tarotSubtitle"></small></span></span>
</div></div>
<div class="gallery-info"><p class="eyebrow" id="galleryRank">已解锁的鲸娘</p><h2 id="galleryTitle">人物图鉴</h2><p id="galleryDescription"></p><p class="tarot-blessing" id="tarotBlessing" hidden></p><button class="portrait-button" id="portraitButton" hidden>展开高清立绘 ↗</button><div class="gallery-rule" id="galleryRule"></div><div class="gallery-navigation"><button class="secondary-button" id="galleryPrev" aria-label="上一个形象">←</button><span id="galleryIndex"></span><button class="secondary-button" id="galleryNext" aria-label="下一个形象">→</button></div></div></div></dialog>
<dialog class="modal portrait-modal" id="portraitDialog" aria-label="高清角色立绘"><button class="modal-close" data-close="portraitDialog" aria-label="关闭高清立绘">×</button><img id="portraitImage" alt=""></dialog>

<dialog class="modal leaderboard-modal" id="leaderboardDialog" aria-labelledby="leaderboardTitle">
<button class="modal-close" data-close="leaderboardDialog" aria-label="关闭排行榜">×</button><p class="eyebrow">让每一次相遇，留下光</p><h2 id="leaderboardTitle">海湾排行榜</h2>
<form id="nicknameForm" class="nickname-form"><label for="playerName">你的昵称</label><input id="playerName" maxlength="24" placeholder="取一个海湾昵称" required autocomplete="nickname"><button type="submit">保存</button></form>
<p id="myRank" class="my-rank"></p><p id="leaderboardCount" class="ranking-count"></p><div class="ranking-head"><span>排名</span><span>旅人</span><span>最高分</span></div><ol id="leaderboardRows" class="ranking-list"></ol><p id="leaderboardEmpty" class="ranking-empty">海湾还没有成绩，第一位旅人会是你吗？</p>
<p id="leaderboardStatus" class="ranking-status" role="status"></p><button class="text-button" id="leaderboardRefresh">刷新 / 重试保存</button></dialog>
<div class="sr-only" id="liveAnnouncement" aria-live="polite"></div>
</body></html>
