<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8ff">
  <meta name="robots" content="noindex">
  <title>404 · DeepSeek 深海游乐场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234d6bfe'/%3E%3Cpath d='M12 36c2-11 11-19 24-19 9 0 16 4 20 11h8c2 0 3 2 1 4l-6 5c-1 1-2 2-4 2h-5c-4 5-11 8-18 8-12 0-21-4-20-11Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2a44;
      --muted: rgba(29, 42, 68, .58);
      --coral: #ff7b63;
      --cyan: #3db8c5;
      --lime: #d8f45f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 18%, rgba(61, 184, 197, .18), transparent 28rem),
        radial-gradient(circle at 88% 12%, rgba(255, 123, 99, .16), transparent 24rem),
        linear-gradient(160deg, #f7f8ff, #eef6f4 55%, #f8f3ea);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .code {
      font: 700 12px/1 "Cascadia Code", Consolas, monospace;
      letter-spacing: .18em;
      color: var(--cyan);
    }
    h1 {
      margin: 22px 0 10px;
      font-size: clamp(48px, 14vw, 92px);
      line-height: 1;
      letter-spacing: -.06em;
      background: linear-gradient(120deg, var(--coral), #4d6bfe 55%, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      margin-top: 28px;
      padding: 0 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--lime), #bfe24f);
      color: #1d2a44;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(77, 107, 254, .12);
    }
    a:hover { filter: brightness(1.03); }
  </style>
</head>
<body>
  <main>
    <div class="code">404 / LOST IN THE DEEP</div>
    <h1>潜得太深了。</h1>
    <p>这一页不在深海地图里。回到游乐场，挑一局重新开始。</p>
    <a href="/">返回游乐场</a>
  </main>
</body>
</html>
